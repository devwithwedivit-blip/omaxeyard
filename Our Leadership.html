<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Leadership</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--ink:#13233a;--mute:#566274;--blue:#0b4a8f;--card:#fff;--edge:#e2ddd1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1520;--ink:#eaf0f8;--mute:#9aa8ba;--blue:#5a9bf0;--card:#142033;--edge:#27364b}}
:root[data-theme="dark"]{--bg:#0d1520;--ink:#eaf0f8;--mute:#9aa8ba;--blue:#5a9bf0;--card:#142033;--edge:#27364b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;padding:64px 5vw 72px}
header{text-align:center;margin-bottom:44px}
h1{font:600 clamp(2rem,4.5vw,3.1rem)/1.1 "Cormorant Garamond",Georgia,serif;margin:0;display:inline-block;padding:0 3rem 12px;border-bottom:1px solid var(--ink)}
header p{margin:14px 0 0;color:var(--mute);font-size:.95rem}
.row{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3vw,40px)}
.p{all:unset;display:block;cursor:pointer;text-align:center;border-radius:14px}
.p:focus-visible .ph{outline:3px solid var(--blue);outline-offset:4px}
.ph{display:block;aspect-ratio:3/4;border-radius:12px;overflow:hidden;box-shadow:0 10px 28px rgba(10,30,60,.14);outline:3px solid transparent;outline-offset:4px;position:relative;container-type:inline-size;transition:transform .4s cubic-bezier(.25,1.3,.4,1),outline-color .3s,box-shadow .4s}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s}
.p:hover .ph{transform:translateY(-3px)}
.p.on .ph img{filter:grayscale(1)}
.p.on .ph{transform:translateY(-10px);outline-color:var(--blue);box-shadow:0 22px 40px rgba(11,74,143,.3)}
.cap{display:block;margin-top:16px}
.cap b{display:block;font:600 1.35rem "Cormorant Garamond",Georgia,serif}
.cap span{color:var(--mute);font-size:.9rem}
.glass{position:absolute;left:3.5cqw;right:3.5cqw;bottom:3.5cqw;text-align:left;padding:3.8cqw 4.2cqw;border-radius:3cqw;color:#fff;background:rgba(11,40,85,.46);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border:1px solid rgba(255,255,255,.38);box-shadow:0 8px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.35);opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .45s .1s,transform .45s .1s}
.p.on .glass{opacity:1;transform:none}
.glass h2{font:600 7.6cqw/1.1 "Cormorant Garamond",Georgia,serif;margin:0 0 1cqw}
.glass .role{margin:0 0 2.4cqw;padding-bottom:2.4cqw;border-bottom:1px solid rgba(255,255,255,.3);font-weight:600;font-size:4.2cqw;letter-spacing:.04em;color:#cfe3ff}
.glass .d{margin:0;font-size:4.5cqw;line-height:1.45;color:#f2f6fb}
@media (max-width:700px){.row{grid-template-columns:1fr;max-width:340px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style></head><body>
