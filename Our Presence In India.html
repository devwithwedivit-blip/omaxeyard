<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Presence in India</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0ea;--ink:#13233a;--mute:#6b7686;--off:#f8f6f1;--line:#2c3644;--blue:#1c5aa6;--blue-d:#0a3a7c;--red:#c63a32;--card:#fff;--edge:#e1dcd0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;padding:48px 5vw 56px}
header{text-align:center;margin-bottom:28px}
h1{font:600 clamp(2rem,4.5vw,3.1rem)/1.1 "Cormorant Garamond",Georgia,serif;margin:0 auto;display:inline-block;padding:0 3rem 12px;border-bottom:1px solid var(--ink);letter-spacing:.02em}
header p{margin:14px 0 0;color:var(--mute);font-size:.95rem}
#stage{position:relative;max-width:1180px;margin:0 auto;container-type:inline-size}
#map{display:block;width:56%;height:auto;margin:0 auto;overflow:visible}
.s{fill:var(--off);stroke:var(--line);stroke-width:.9;stroke-linejoin:round;pointer-events:none}
.s.b{fill:var(--blue);stroke:var(--off);stroke-width:1.2;pointer-events:auto;cursor:pointer;transition:fill .35s,transform .45s cubic-bezier(.25,1.4,.4,1),filter .35s;transform-box:fill-box;transform-origin:center}
.s.b:hover{fill:#2a6dc2}
.s.b:focus-visible{outline:none;stroke:var(--red);stroke-width:3}
.s.b.on{fill:var(--blue-d);stroke:#fff;stroke-width:1.8;transform:translateY(-6px) scale(1.06);filter:drop-shadow(0 14px 12px rgba(10,58,124,.5))}
.hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#lines line{stroke:var(--red);stroke-width:1.2;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .55s .1s ease-out forwards}
#lines circle{fill:var(--red);opacity:0;animation:fade .3s .05s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.card{position:absolute;width:min(220px,19%);background:var(--card);border:1px solid var(--edge);border-top:3px solid var(--blue);border-radius:4px;padding:18px 20px 16px;box-shadow:0 18px 40px rgba(10,30,60,.16);animation:cin .55s .15s cubic-bezier(.2,.8,.2,1) both}
.card.L{left:0}.card.R{right:0}
.card h3{margin:0 0 10px;color:var(--blue-d);font:600 .95rem Jost,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.card ul{margin:0;padding:0;list-style:none}
.card li.feat{font-size:1.45rem;font-weight:600;color:var(--blue-d);padding:4px 0 10px;border-top:0;letter-spacing:.01em}
.card li{padding:6px 0;border-top:1px solid var(--edge);font-size:.95rem;animation:lin .4s both}
@keyframes cin{from{opacity:0;transform:translateX(var(--dx,16px))}to{opacity:1;transform:none}}
@keyframes lin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card.L{--dx:-16px}
@media (max-width:960px){
 #map{width:100%}
 .card{position:absolute!important;width:44cqw;max-width:46%;padding:2.2cqw 2.6cqw 2cqw;border-radius:clamp(3px,0.8cqw,5px);border-top-width:clamp(2px,0.7cqw,3px);box-shadow:0 8px 24px rgba(10,30,60,.18)}
 .card h3{margin:0 0 1.4cqw;font-size:clamp(10px,3cqw,15px);letter-spacing:.1em}
 .card li.feat{font-size:clamp(13.5px,4.3cqw,22px);font-weight:700;padding:1.2cqw 0 1.8cqw;letter-spacing:.01em}
 .card li{padding:1cqw 0;font-size:clamp(9.5px,2.7cqw,14px)}
}
@media (max-width:600px){
 body{padding:24px 16px 36px}
 header{margin-bottom:20px}
 h1{padding:0 1.2rem 8px;font-size:clamp(1.75rem,5vw,2.4rem)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style></head><body>
